name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Build app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Lectigo.xcworkspace \
            -scheme Lectigo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in Release-iphoneos output" >&2
            exit 1
          fi
          rm -rf Payload Lectigo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Lectigo.app
          /usr/bin/zip -qry Lectigo-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lectigo-unsigned-ipa
          path: Lectigo-unsigned.ipa
          if-no-files-found: error

      - name: Publish unsigned IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="latest-unsigned-ipa"
          RELEASE_TITLE="Latest unsigned IPA"
          RELEASE_NOTES="Automated unsigned IPA build from ${GITHUB_SHA}."

          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" Lectigo-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          else
            gh release create "$TAG_NAME" Lectigo-unsigned.ipa --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          fi